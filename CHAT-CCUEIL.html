<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Les défis de Poupi</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Fredoka', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#8ec5fc,#e0c3fc);
    overflow:hidden;
}

.container{
    text-align:center;
    background:rgba(255,255,255,0.95);
    padding:40px 30px;
    border-radius:30px;
    box-shadow:0 15px 40px rgba(0,0,0,0.15);
    max-width:500px;
    width:90%;
    position:relative;
}

.kitten{
    font-size:80px;
    margin-bottom:10px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

h1{
    color:#ff6b81;
    font-size:clamp(2rem,5vw,3rem);
    margin-bottom:10px;
}

.subtitle{
    color:#666;
    margin-bottom:30px;
    font-size:1.1rem;
}

.buttons{
    display:flex;
    flex-direction:column;
    gap:18px;
}

.btn{
    border:none;
    border-radius:20px;
    padding:18px;
    font-size:1.3rem;
    font-weight:600;
    cursor:pointer;
    color:white;
    transition:all 0.3s ease;
    box-shadow:0 6px 15px rgba(0,0,0,0.15);
}

.btn:hover{
    transform:translateY(-4px) scale(1.03);
}

.maths{
    background:linear-gradient(135deg,#ff9a44,#ff6b6b);
}

.francais{
    background:linear-gradient(135deg,#7f7fd5,#86a8e7);
}

.english{
    background:linear-gradient(135deg,#43cea2,#185a9d);
}

.paw{
    position:absolute;
    font-size:24px;
    opacity:0.15;
}

.p1{top:20px;left:20px;}
.p2{top:40px;right:30px;}
.p3{bottom:25px;left:35px;}
.p4{bottom:15px;right:25px;}

@media (max-width:500px){

    .container{
        padding:30px 20px;
    }

    .btn{
        font-size:1.1rem;
        padding:16px;
    }

    .kitten{
        font-size:65px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="paw p1">🐾</div>
    <div class="paw p2">🐾</div>
    <div class="paw p3">🐾</div>
    <div class="paw p4">🐾</div>

    <div class="kitten">🐱</div>

    <h1>Les défis de Poupi</h1>

    <p class="subtitle">
        Choisis ta mission et relève le défi !
    </p>

    <div class="buttons">
        <button class="btn maths" onclick="window.location.href='file:///D:/CLAUDE/MATH-CHAT.html'">
            ➕ MATHS
        </button>

        <button class="btn francais" onclick="window.location.href='file:///D:/CLAUDE/FRAN-CHAT.html'">
            📚 FRANÇAIS
        </button>

        <button class="btn english" onclick="window.location.href='file:///D:/CLAUDE/ENG-CHAT.html'">
            🇬🇧 ENGLISH
        </button>
    </div>

</div>

</body>
</html>
